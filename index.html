<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coding Journey</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            background-color: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        h2 {
            color: #3498db;
            font-size: 1.2em;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            font-size: 1.1em;
        }
        .skills-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f4f8;
            border-radius: 8px;
        }
        .skill-badge {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            margin: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Halo! I'm Adara Filia Azalia</h1>
        <h2>Siswa SMP & Aspiring Programmer</h2>
        
        <p>Welcome to my very first website! I am a junior high school student currently learning how to code. I built this page to document my coding journey and the projects I create along the way.</p>

        <div class="skills-box">
            <h3>What I'm Learning:</h3>
            <span class="skill-badge">HTML</span>
            <span class="skill-badge">CSS</span>
            <span class="skill-badge">GitHub</span>
        </div>
    </div>

</body>
</html>
